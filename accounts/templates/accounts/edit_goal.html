<!DOCTYPE html>
<html>

<head>
    <title>Edit Goal</title>
</head>

<body>

    <h1>Edit Goal</h1>

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="title" value="{{ goal.title }}" required>

        <br><br>

        <input type="number" name="target" min="1" value="{{ goal.target }}" required>

        <br><br>

        <select name="subject" id="subject">

            <option value="">
                No Subject
            </option>

            {% for subject in subjects %}

            <option value="{{ subject.id }}" {% if goal.subject and goal.subject.id == subject.id %} selected {% endif %}>
                {{ subject.name }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <select name="topic" id="topic">

            <option value="">
                No Topic
            </option>

            {% for topic in topics %}

            <option value="{{ topic.id }}" {% if goal.topic and goal.topic.id == topic.id %} selected {% endif %}>
                {{ topic.name }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'goals' %}">
        Back to Goals
    </a>

    <script>
        const subjectSelect = document.getElementById("subject");
        const topicSelect = document.getElementById("topic");
        const currentGoalSubjectId = "{{ goal.subject.id|default:'' }}";
        const currentGoalTopicId = "{{ goal.topic.id|default:'' }}";

        subjectSelect.addEventListener("change", function () {
            const subjectId = this.value;

            topicSelect.innerHTML = '<option value="">No Topic</option>';

            if (!subjectId) {
                return;
            }

            fetch(`/subjects/${subjectId}/topics/`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to fetch topics");
                    }
                    return response.json();
                })
                .then(data => {
                    topicSelect.innerHTML = '<option value="">No Topic</option>';
                    if (data.topics && data.topics.length > 0) {
                        data.topics.forEach(topic => {
                            const option = document.createElement("option");
                            option.value = topic.id;
                            option.textContent = topic.name;

                            if (currentGoalSubjectId && String(currentGoalSubjectId) === String(subjectId) &&
                                currentGoalTopicId && String(currentGoalTopicId) === String(topic.id)) {
                                option.selected = true;
                            }

                            topicSelect.appendChild(option);
                        });
                    }
                })
                .catch(err => {
                    console.error("Error loading subject topics:", err);
                });
        });
    </script>

    {% include "accounts/ai_bar.html" %}

</body>

</html>
