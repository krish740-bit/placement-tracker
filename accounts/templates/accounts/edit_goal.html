<!DOCTYPE html>
<html>

<head>
    <title>Edit Goal</title>
</head>

<body>

    <h1>Edit Goal</h1>

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="title" value="{{ goal.title }}" required>

        <br><br>

        <input type="number" name="target" min="1" value="{{ goal.target }}" required>

        <br><br>

        <select name="subject">

            <option value="">
                No Subject
            </option>

            {% for subject in subjects %}

            <option value="{{ subject.id }}" {% if goal.subject and goal.subject.id==subject.id %} selected {% endif %}>
                {{ subject.name }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <select name="topic">

            <option value="">
                No Topic
            </option>

            {% for topic in topics %}

            <option value="{{ topic.id }}" {% if goal.topic and goal.topic.id==topic.id %} selected {% endif %}>
                {{ topic.name }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'goals' %}">
        Back to Goals
    </a>

    {% include "accounts/ai_bar.html" %}


</body>

</html>
