<div id="ai-bar">

    <div id="ai-messages">

        <div class="ai-message ai-bot">
            Hi! I'm your Placement Tracker AI. Ask me about your progress, goals, revision, DSA, or anything in your
            tracker.
        </div>

    </div>

    <div id="ai-input-area">

        {% csrf_token %}

        <input type="text" id="ai-input" placeholder="Ask your Placement Tracker AI..." onkeydown="handleAIKey(event)">

        <button onclick="sendAIMessage()">
            Ask
        </button>

    </div>

</div>


<style>
    #ai-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: white;
        border-top: 1px solid #ddd;
        padding: 10px;
        z-index: 9999;
    }

    #ai-messages {
        max-height: 180px;
        overflow-y: auto;
        margin-bottom: 8px;
    }

    .ai-message {
        padding: 8px 12px;
        margin: 5px 0;
        border-radius: 8px;
    }

    .ai-user {
        background: #e8f0fe;
        text-align: right;
    }

    .ai-bot {
        background: #f3f3f3;
    }

    #ai-input-area {
        display: flex;
        gap: 8px;
    }

    #ai-input {
        flex: 1;
        padding: 10px;
    }

    #ai-input-area button {
        padding: 10px 18px;
        cursor: pointer;
    }
</style>


<script>

    let aiConversation = [];

    function handleAIKey(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendAIMessage();

        }

    }


    function formatAIResponse(text) {

        return text

            // Escape HTML first
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")

            // Headings
            .replace(/^### (.*)$/gm, "<strong>$1</strong>")
            .replace(/^## (.*)$/gm, "<strong>$1</strong>")
            .replace(/^# (.*)$/gm, "<strong>$1</strong>")

            // Bold
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

            // Bullet points
            .replace(/^\* (.*)$/gm, "• $1")
            .replace(/^- (.*)$/gm, "• $1")

            // New lines
            .replace(/\n/g, "<br>");
    }


    async function sendAIMessage() {

        const input = document.getElementById("ai-input");

        const message = input.value.trim();

        if (!message) {
            return;
        }

        aiConversation.push({
            role: "user",
            content: message
        });


        const messages = document.getElementById("ai-messages");


        messages.innerHTML += `
        <div class="ai-message ai-user">
            ${message}
        </div>
    `;


        input.value = "";


        const csrfToken = document.querySelector(
            '#ai-input-area input[name="csrfmiddlewaretoken"]'
        ).value;


        messages.innerHTML += `
        <div class="ai-message ai-bot" id="ai-loading">
            Thinking...
        </div>
    `;


        let page = "general";
        let objectId = null;


        {% if subject %}

        page = "subject";
        objectId = "{{ subject.id }}";

        {% elif topic %}

        page = "topic";
        objectId = "{{ topic.id }}";

        {% elif request.resolver_match.url_name == "revision" %}

        page = "revision";

        {% elif request.resolver_match.url_name == "goals" %}

        page = "goals";

        {% elif request.resolver_match.url_name == "dashboard" %}

        page = "dashboard";

        {% endif %}


        try {

            const response = await fetch("/ai/chat/", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },

                body: JSON.stringify({
                    message: message,
                    page: page,
                    object_id: objectId,
                    conversation: aiConversation
                })

            });


            const data = await response.json();


            const loading = document.getElementById("ai-loading");

            if (loading) {
                loading.remove();
            }


            if (data.reply) {

                aiConversation.push({
                    role: "assistant",
                    content: data.reply
                });

                messages.innerHTML += `
                    <div class="ai-message ai-bot">
                        ${formatAIResponse(data.reply)}
                    </div>
                `;



            } else {

                messages.innerHTML += `
                <div class="ai-message ai-bot">
                    Error: ${data.error}
                </div>
            `;

            }


            messages.scrollTop = messages.scrollHeight;


        } catch (error) {

            const loading = document.getElementById("ai-loading");

            if (loading) {
                loading.remove();
            }


            messages.innerHTML += `
            <div class="ai-message ai-bot">
                Something went wrong while contacting the AI.
            </div>
        `;

        }

    }

</script>
